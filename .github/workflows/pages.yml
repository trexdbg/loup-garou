name: Publier Thiercelieux Solo sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Vérifier et publier le site statique
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les archives et le catalogue
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*_tts.py'
      - name: Assembler uniquement les fichiers publics
        run: |
          mkdir -p site/parties
          cp index.html styles.css launcher.css mj-console.css mj-console.js roles.js modes.js role-art.js stories.js launcher.js voice-pool.js piper-free.js scene-player.js voice-live.js seating-model.js table-seating.js mj-private.js tts-config.json site/
          # Les seules données copiées dans Pages sont les archives publiques.
          if [ -f parties/index.json ]; then cp parties/index.json site/parties/index.json; fi
          for folder in parties/*/; do
            [ -d "$folder" ] || continue
            dest="site/$folder"
            mkdir -p "$dest"
            for filename in partie.json narrations.md journal.md dialogues.ndjson; do
              if [ -f "${folder}${filename}" ]; then cp "${folder}${filename}" "$dest"; fi
            done
          done
          mkdir -p site/voices
          cp voices/phonon-fr.json site/voices/
          touch site/.nojekyll
      - name: Restaurer les clips Gemini déjà générés
        uses: actions/cache@v4
        with:
          path: .cache/gemini-tts
          key: gemini-tts-v1-${{ github.sha }}
          restore-keys: |
            gemini-tts-v1-
      - name: Vérifier le convertisseur audio FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Retrouver le cache des voix Phonon
        uses: actions/cache@v4
        with:
          path: |
            .cache/phonon-tts
            .cache/huggingface
          key: phonon-fr-v1-${{ github.sha }}
          restore-keys: |
            phonon-fr-v1-
      - name: Générer les MP3 avec Phonon français (prioritaire)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN disponible : Phonon FR utilise les 15 voix, si la licence a été acceptée."
            if ! python3 -m pip install --quiet ptts; then
              echo "::warning::Installation Phonon impossible; Gemini ou voix locales seront utilisées."
            fi
          else
            echo "::warning::HF_TOKEN absent : accepter les conditions gradium/phonon-40m-fr et ajouter le secret pour activer Phonon."
          fi
          python3 scripts/generate_phonon_tts.py --site site --max-scenes 3 --max-lines 20
      - name: Préparer les voix Gemini des scènes récentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-lite-tts
        run: |
          # Vérification sans jamais afficher la valeur du token dans les logs.
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Configuration Gemini : secret GEMINI_API_KEY présent."
          else
            echo "::warning::Secret GEMINI_API_KEY absent : lecture vocale locale uniquement."
          fi
          python3 scripts/generate_gemini_tts.py --site site --max-scenes 3 --max-lines 8
      - name: Préparer les MP3 de secours gratuits
        run: |
          if ! command -v espeak-ng >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq espeak-ng
          fi
          python3 scripts/generate_offline_tts.py site
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
