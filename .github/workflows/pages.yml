name: Publier Thiercelieux Solo sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Vérifier et publier le site statique
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier le jeu et les illustrations
        run: npm test
      - name: Assembler uniquement les fichiers publics
        run: |
          mkdir -p site
          cp index.html styles.css roles.js role-art.js stories.js app.js site/
          touch site/.nojekyll
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
