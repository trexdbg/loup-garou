name: Publier Thiercelieux Solo sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Vérifier et publier le site statique
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les archives et le catalogue
        run: npm test
      - name: Assembler uniquement les fichiers publics
        run: |
          mkdir -p site/parties
          cp index.html styles.css launcher.css roles.js modes.js role-art.js stories.js launcher.js piper-free.js scene-player.js voice-live.js seating-model.js table-seating.js mj-private.js tts-config.json site/
          # Les seules données copiées dans Pages sont les archives publiques.
          if [ -f parties/index.json ]; then cp parties/index.json site/parties/index.json; fi
          for folder in parties/*/; do
            [ -d "$folder" ] || continue
            dest="site/$folder"
            mkdir -p "$dest"
            for filename in partie.json narrations.md journal.md dialogues.ndjson; do
              if [ -f "${folder}${filename}" ]; then cp "${folder}${filename}" "$dest"; fi
            done
          done
          touch site/.nojekyll
      - name: Restaurer les clips Gemini déjà générés
        uses: actions/cache@v4
        with:
          path: .cache/gemini-tts
          key: gemini-tts-v1-${{ github.sha }}
          restore-keys: |
            gemini-tts-v1-
      - name: Préparer les voix Gemini des scènes récentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Sans secret, aucune requête à Google et le lecteur utilise les voix locales.
          python3 scripts/generate_gemini_tts.py --site site --max-scenes 3 --max-lines 24
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Déployer le site
        id: deployment
        uses: actions/deploy-pages@v4
